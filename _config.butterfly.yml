
# --------------------------------------
# 导航栏设置
# --------------------------------------
nav:
  # 导航栏 Logo 图片
  logo: /img/logo.png
  display_title: true
  display_post_title: true
  # 是否固定导航栏
  fixed: false

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-user


# --------------------------------------
# 代码块设置
# --------------------------------------
code_blocks:
  # 代码块主题：darker / pale night / light / ocean / false
  theme: darker
  macStyle: false
  # 代码块最大高度（单位 px） false=不限制
  height_limit: false
  word_wrap: false
  # 工具栏
  copy: true
  language: true
  # true: 默认折叠代码块 | false: 默认展开 | none: 展开并隐藏折叠按钮
  shrink: false
  fullpage: false

# 社交链接
# 格式：图标: 链接 || 名称 || 颜色
social:
  # fab fa-github: https://github.com/你的ID || Github || '#24292e'
  # fas fa-envelope: mailto:xxx@gmail.com || 邮箱 || '#4a7dbe'

# --------------------------------------
# 图片相关设置
# --------------------------------------
favicon: /img/favicon.png
avatar:
  img: /img/avatar.png
  effect: false
# 全局关闭顶部横幅图
disable_top_img: false
# 页面未设置横幅图时，使用默认顶部图
default_top_img: https://www.dmoe.cc/random.php
# 首页横幅图
index_img: https://www.dmoe.cc/random.php
# 归档页横幅图
archive_img:
# 标签页横幅（注意：是单个标签页面，不是标签汇总页）
tag_img:
# 为不同标签单独设置横幅图
# 格式：
#  - 标签名: 图片地址
tag_per_img:
# 分类页横幅（注意：是单个分类页面，不是分类汇总页）
category_img:
# 为不同分类单独设置横幅图
# 格式：
#  - 分类名: 图片地址
category_per_img:
# 页脚背景图 false=关闭
footer_img: false
# 网站背景
# 支持颜色、图片链接，也可以放数组，每次加载随机切换
background:
cover:
  # 是否开启封面图
  index_enable: true
  aside_enable: true
  archives_enable: true
  # 文章无封面时，使用的默认封面图
  default_cover:
    # - xxx.jpg
# 图片失效时替换图
error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg
# 简易404页面
error_404:
  enable: false
  subtitle: '页面不存在'
  background: /img/error-page.png

post_meta:
  # 首页文章元信息
  page:
    # 日期展示：created 创建时间 / updated 更新时间 / both 两者都显示
    date_type: created
    # 日期样式：date 日期格式 / relative 相对时间
    date_format: date
    categories: true
    tags: false
    label: true
  # 文章详情页元信息
  post:
    # 位置 left / center
    position: left
    # 日期展示：created 创建时间 / updated 更新时间 / both 两者都显示
    date_type: both
    # 日期样式：date 日期格式 / relative 相对时间
    date_format: date
    categories: true
    tags: true
    label: true

# --------------------------------------
# 首页设置
# --------------------------------------
# 首页顶部图内网站信息的垂直位置
# 示例：300px / 10%
index_site_info_top:
# 首页顶部图高度
# 示例：300px
index_top_img_height: 420px
# 首页副标题
subtitle: 
  enable: true
  # 打字机效果
  effect: true
  # typed.js 自定义配置
  # https://github.com/mattboldt/typed.js/#customization
  typed_option:
  # 句子来源（仅中文接口）
  # false 关闭 | 1 一言 | 2 今日API | 3 今日诗词
  source: 1
  # 关闭打字机时，只展示第一行文字
  sub: 
# 首页文章排版样式
# 1:封面左，文字右
# 2:封面右，文字左
# 3:封面左右交替
# 4:封面在上，文字在下
# 5:文字叠加在封面图上
# 6:瀑布流，封面在上
# 7:瀑布流，文字叠加封面
index_layout: 6
# 首页文章简介
index_post_content:
  method: 3
  # 当 method=2/3，控制简介截取长度
  length: 500

# --------------------------------------
# 文章页面设置
# --------------------------------------
toc:
  post: true
  page: false
  number: true
  expand: false
  # 仅文章页生效：简洁目录样式
  style_simple: false
  scroll_percent: true
post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
# 文章打赏
reward:
  enable: false
  text:
  QR_code:
    # - img: /img/wechat.jpg
    #   link:
    #   text: 微信
    # - img: /img/alipay.jpg
    #   link:
    #   text: 支付宝
# 文章在线编辑入口
post_edit:
  enable: false
  # url: https://github.com/用户名/仓库名/edit/分支名/source/
  # 示例：https://github.com/jerryc127/butterfly.js.org/edit/main/source/
  url:
# 相关文章推荐
related_post:
  enable: true
  # 展示数量
  limit: 6
  # 排序依据：created 创建时间 / updated 更新时间
  date_type: created
# 文章分页
# 1: 下一篇 = 更早文章
# 2: 下一篇 = 更新文章
# false: 关闭分页
post_pagination: 1
# 文章过期提示
noticeOutdate:
  enable: false
  # 样式 simple / flat
  style: flat
  # 多少天后显示过期提示
  limit_day: 365
  # 位置 top / bottom
  position: top
  message_prev: 距离上次更新已经
  message_next: 天，文章内容可能已经过时。

# --------------------------------------
# 页脚设置
# --------------------------------------
footer:
  nav:
  owner:
    enable: true
    since: 2026
  # 主题与框架版权信息
  copyright:
    enable: false
    version: false
  custom_text: 

# --------------------------------------
# 侧边栏设置
# --------------------------------------
aside:
  enable:   true
  hide: false
  # 右下角显示侧边栏隐藏按钮
  button: true
  mobile: true
  # 侧边栏位置 left / right
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: '记录个人生活，感悟，趣事分享，学习与交流！'
    button:
      enable: true
      icon: fab fa-github
      text: 访问Github
      link: https://github.com/sszcs258
  card_announcement:
    enable: true
    content: 欢迎，欢迎！
  card_recent_post:
    enable: true
    # 0 = 显示全部
    limit: 5
    # 排序 date / updated
    sort: date
    sort_order:
  card_newest_comments:
    enable: false
    sort_order:
    limit: 6
    # 缓存时长，单位分钟，数据保存在本地浏览器
    storage: 10
    avatar: true
  card_categories:
    enable: true
    # 0 = 显示全部
    limit: 8
    # none / true / false
    expand: none
    sort_order:
  card_tags:
    enable: true
    # 0 = 显示全部
    limit: 40
    color: false
    custom_colors:
    # 标签排序规则 random/name/length
    orderby: random
    # 升序1 / 降序 -1
    order: 1
    sort_order:
  card_archives:
    enable: true
    # 归档类型 monthly 按月 / yearly 按年
    type: monthly
    # 时间格式 示例：YYYY年MM月
    format: MMMM YYYY
    # 升序1 / 降序 -1
    order: -1
    # 0 = 全部
    limit: 8
    sort_order:
  card_post_series:
    enable: true
    # 标题是否显示系列名称
    series_title: false
    # 排序依据 title / date
    orderBy: 'date'
    # 升序1 / 降序 -1
    order: -1
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:
    # 网站运行时长，格式：月/日/年 时:分
    # 留空关闭
    runtime_date: 10/01/2026 22:00

# --------------------------------------
# 右下角悬浮按钮
# --------------------------------------
# 右下角按钮距离底部距离（单位px）
rightside_bottom:
# 简繁切换
translate:
  enable: false
  # 按钮默认文字
  default: 繁
  # 网站默认语言：1繁体 / 2简体
  defaultEncoding: 2
  # 切换延迟
  translateDelay: 0
  # 简体模式下按钮文字
  msgToTraditionalChinese: '繁'
  # 繁体模式下按钮文字
  msgToSimplifiedChinese: '簡'
# 阅读模式
readmode: true
# 深色模式
darkmode:
  enable: true
  # 是否显示切换按钮
  button: true
  # 自动切换深色模式
  # autoChangeMode:1 跟随系统，不支持系统则晚6点到早6点自动切换
  # autoChangeMode:2 固定晚6点到早6点切换
  # autoChangeMode: false 关闭自动切换
  autoChangeMode: 1
  # 自定义浅色模式开始、结束时间，0~24，不填默认6点、18点
  start:
  end:
# 回到顶部按钮是否显示滚动百分比
rightside_scroll_percent: false
# 右下角功能按钮排序
# 不要重复填写
rightside_item_order:
  enable: false
  # 默认隐藏：readmode,translate,darkmode,hideAside
  hide:
  # 默认显示：toc,chat,comment
  show:
# 右下角配置面板动画
rightside_config_animation: true

# --------------------------------------
# 全局设置
# --------------------------------------
anchor:
  # 滚动时自动更新地址栏锚点
  auto_update: false
  # 点击标题滚动并更新锚点
  click_to_scroll: false
photofigcaption: false
copy:
  enable: true
  # 复制内容追加版权信息
  copyright:
    enable: false
    # 超过多少字符才追加版权
    limit_count: 150
# 字数统计插件 hexo-wordcount
wordcount:
  enable: false
  # 文章内显示字数
  post_wordcount: true
  # 文章阅读时长
  min2read: true
  # 侧边栏网站总字数
  total_wordcount: true
# 不蒜子访问统计
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# --------------------------------------
# 数学公式
# --------------------------------------
# per_page: true 所有页面加载公式脚本
# per_page: false 只在文章头部设置 mathjax:true / katex:true 的页面加载
math:
  # 选择 mathjax / katex，留空关闭
  use:
  per_page: true
  hide_scrollbar: false
  mathjax:
    # 右键公式菜单
    enableMenu: true
    # 公式编号 all全部 / ams只编号指定 / none不编号
    tags: none
  katex:
    # 复制公式源码
    copy_tex: false

# --------------------------------------
# 搜索功能
# --------------------------------------
search:
  # 可选 algolia_search / local_search / docsearch，留空关闭搜索
  use:
  placeholder:
  # Algolia搜索
  algolia_search:
    # 单次搜索结果数量
    hitsPerPage: 6
  # 本地搜索
  local_search:
    # 页面加载时预加载搜索索引
    preload: false
    # 每篇文章最多展示多少条结果，-1展示全部
    top_n_per_article: 1
    # 转义HTML
    unescape: false
    # 本地搜索分页
    pagination:
      enable: false
      hitsPerPage: 8
    CDN:
  # Docsearch（Algolia官方文档搜索）
  docsearch:
    appId:
    apiKey:
    indexName:
    option:

# --------------------------------------
# 分享功能
# --------------------------------------
share:
  # sharejs / addtoany，留空关闭
  use: sharejs
  # Share.js
  sharejs:
    sites: facebook,x,wechat,weibo,qq
  # AddToAny
  addtoany:
    item: facebook,x,wechat,sina_weibo,facebook_messenger,email,copy_link

# --------------------------------------
# 评论系统
# --------------------------------------
comments:
  # 最多填写两套，第一个为默认启用
  # 可选 Disqus/Disqusjs/Livere/Gitalk/Valine/Waline/Utterances/Facebook Comments/Twikoo/Giscus/Remark42/Artalk
  use:
  # 评论按钮旁显示评论系统名称
  text: true
  # 懒加载：评论模块进入视口才加载，开启后评论数量统计失效
  lazyload: false
  # 文章顶部图显示评论数量
  count: false
  # 首页卡片显示评论数量
  card_post_count: false
# Disqus
disqus:
  shortname:
  apikey:
# DisqusJS（Disqus国内替代）
disqusjs:
  shortname:
  apikey:
  option:
# Livere 来必力
livere:
  uid:
# Gitalk
gitalk:
  client_id:
  client_secret:
  repo:
  owner:
  admin:
  option:
# Valine
valine:
  appId:
  appKey:
  avatar: monsterid
  # 国内自定义域名填写服务端地址，海外自动识别
  serverURLs:
  bg:
  # 使用Valine访问量统计作为页面PV
  visitor: false
  option:
# Waline
waline:
  serverURL:
  bg:
  # 使用Waline访问量统计作为页面PV
  pageview: false
  option:
# Utterances
utterances:
  repo:
  # issue映射方式 pathname/url/title/og:title
  issue_term: pathname
  # 主题 github-light/github-dark/github-dark-orange/icy-dark/dark-blue/photon-dark
  light_theme: github-light
  dark_theme: photon-dark
  js:
  option:
# Facebook评论
facebook_comments:
  app_id:
  user_id:
  pageSize:
  # 排序 social / time / reverse_time
  order_by: social
  lang: en_US
# Twikoo
twikoo:
  envId:
  region:
  # 使用Twikoo访问统计作为页面PV
  visitor: false
  option:
# Giscus
giscus:
  repo:
  repo_id:
  category_id:
  light_theme: light
  dark_theme: dark
  js:
  option:
# Remark42
remark42:
  host:
  siteId:
  option:
# Artalk
artalk:
  server:
  site:
  # 使用Artalk访问统计作为页面PV
  visitor: false
  option:

# --------------------------------------
# 在线客服聊天
# --------------------------------------
chat:
  # chatra/tidio/crisp/knocket，留空关闭
  use:
  # 右下角悬浮聊天按钮（推荐开启）
  rightside_button: false
  # 滚动时自动隐藏聊天按钮
  button_hide_show: false
# Chatra
chatra:
  id:
# Tidio
tidio:
  public_key:
# Crisp
crisp:
  website_id:
# Knocket
knocket:
  identifier:

# --------------------------------------
# 网站统计分析
# --------------------------------------
# 百度统计
baidu_analytics:
# Google Analytics
google_analytics:
# Cloudflare分析
cloudflare_analytics:
# Microsoft Clarity
microsoft_clarity:
# Umami 自建统计
umami_analytics:
  enable: false
  # 自建Umami地址
  serverURL:
  script_name: script.js
  website_id:
  option:
  UV_PV:
    site_uv: false
    site_pv: false
    page_pv: false
    # Umami Cloud API密钥 / 自建实例token
    token:
# Google 标签管理器
google_tag_manager:
  tag_id:
  # 可选域名
  domain:

# --------------------------------------
# 广告设置
# --------------------------------------
# Google Adsense
google_adsense:
  enable: false
  auto_ads: true
  js: https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js
  client:
  enable_page_level_ads: true
# 手动插入广告
ad:
  # 首页，每3篇文章插入
  index:
  # 侧边栏广告
  aside:
  # 文章内广告
  post:

# --------------------------------------
# 网站验证（百度、谷歌站长验证）
# --------------------------------------
site_verification:
  # - name: google-site-verification
  #   content: 验证串
  # - name: baidu-site-verification
  #   content: 验证串

# --------------------------------------
# 美化与动效
# --------------------------------------
# 主题配色，颜色值必须用双引号包裹，例如 "#000"
# theme_color:
#   enable: true
#   main: "#49B1F5"
#   paginator: "#00c4b6"
#   button_hover: "#FF7242"
#   text_selection: "#00c4b6"
#   link_color: "#99a9bf"
#   meta_color: "#858585"
#   hr_color: "#A4D8FA"
#   code_foreground: "#F47466"
#   code_background: "rgba(27, 31, 35, .05)"
#   toc_color: "#00c4b6"
#   blockquote_padding_color: "#49b1f5"
#   blockquote_background_color: "#49b1f5"
#   scrollbar_color: "#49b1f5"
#   meta_theme_color_light: "ffffff"
#   meta_theme_color_dark: "#0d0d0d"
# 分类、标签页面UI样式
# index：和首页一致 | default：和归档页一致 | 留空默认
category_ui:
tag_ui:
# 圆角UI开关
rounded_corners_ui: true
# 文本两端对齐
text_align_justify: false
# 头部、页脚遮罩
mask:
  header: true
  footer: true
# 加载动画
preloader:
  enable: false
  # 1 全屏加载动画 | 2 进度条
  source: 1
  # pace主题
  pace_css_url:
# 页面转场动画
enter_transitions: true
# 默认显示模式 light / dark
display_mode: light
# 文章内容美化
beautify:
  enable: false
  # 美化范围 site全站 / post仅文章
  field: post
  # 标题前缀图标 unicode，例如 '\f0c1'
  title_prefix_icon:
  # 图标颜色
  title_prefix_icon_color:
# 全局字体设置
font:
  global_font_size:
  code_font_size:
  font_family:
  code_font_family:
# 博客标题字体
blog_title_font:
  font_link:
  font_family:
# 分割线图标
hr_icon:
  enable: true
  # Font Awesome图标unicode，例如 '\3423'
  icon:
  icon_top:
# 点击特效：激活PowerMode
activate_power_mode:
  enable: false
  colorful: true
  shake: true
  mobile: false
# 背景彩带 canvas_ribbon
canvas_ribbon:
  enable: false
  size: 150
  alpha: 0.6
  zIndex: -1
  click_to_change: false
  mobile: false
# 飘带背景
canvas_fluttering_ribbon:
  enable: false
  mobile: false
# 粒子背景 canvas_nest
canvas_nest:
  enable: false
  # RGB颜色，逗号分隔
  color: '0,0,255'
  opacity: 0.7
  zIndex: -1
  count: 99
  mobile: false
# 鼠标点击烟花特效
fireworks:
  enable: false
  zIndex: 9999
  mobile: false
# 点击爱心
click_heart:
  enable: false
  mobile: false
# 点击文字
clickShowText:
  enable: false
  text:
    # - I
    # - LOVE
    # - YOU
  fontSize: 15px
  random: false

# --------------------------------------
# 图片放大预览
# --------------------------------------
# fancybox / medium_zoom ，留空关闭
lightbox:

# --------------------------------------
# 标签插件设置
# --------------------------------------
# 文章系列
series:
  enable: false
  # 排序 title标题 / date日期
  orderBy: 'title'
  # 升序1 / 降序 -1
  order: 1
  number: true
# ABCJS乐谱渲染
abcjs:
  enable: false
  per_page: true
# Mermaid流程图
mermaid:
  enable: false
  # 在代码块内直接写mermaid代码
  code_write: false
  # 内置主题 default / forest / dark / neutral
  theme:
    light: default
    dark: dark
  # 新标签页打开
  open_in_new_tab: true
  # 缩放平移
  zoom_pan: true
# ChartJs图表
chartjs:
  enable: false
  # 图表文字颜色
  fontColor:
    light: 'rgba(0, 0, 0, 0.8)'
    dark: 'rgba(255, 255, 255, 0.8)'
  # 边框颜色
  borderColor:
    light: 'rgba(0, 0, 0, 0.1)'
    dark: 'rgba(255, 255, 255, 0.2)'
  # 雷达图、极坐标图刻度背景
  scale_ticks_backdropColor:
    light: 'transparent'
    dark: 'transparent'
# Note 提示块
note:
  # 样式 simple 旧版 / modern新版 / flat扁平化 / disabled禁用样式
  style: flat
  icons: true
  border_radius: 3
  # 明暗偏移量
  light_bg_offset: 0

# --------------------------------------
# 其他设置
# --------------------------------------
# PJAX无刷新跳转
pjax:
  enable: false
  # 排除的页面，不触发pjax
  exclude:
    # - /xxxxxx/
# Snackbar 右下角提示弹窗
snackbar:
  enable: false
  # 位置 top-left / top-center / top-right / bottom-left / bottom-center / bottom-right
  position: bottom-left
  bg_light: '#49b1f5'
  bg_dark: '#1f1f1f'
# instant.page 预加载页面
instantpage: false
# 图片懒加载
lazyload:
  enable: false
  # 使用浏览器原生懒加载，不使用第三方库
  native: false
  # 生效范围 site全站 / post仅文章
  field: site
  placeholder:
  blur: false
# PWA离线缓存
pwa:
  enable: false
  manifest:
    apple_touch_icon:
    favicon_32_32:
    favicon_16_16:
    mask_icon:
# Open Graph 社交分享元标签
Open_Graph_meta:
  enable: true
  option:
    # twitter_card:
    # twitter_image:
    # twitter_id:
    # twitter_site:
    # google_plus:
    # fb_admins:
    # fb_app_id:
# 结构化数据（SEO）
structured_data:
  enable: false
  # 网站别名
  alternate_name:
# 自动添加CSS浏览器前缀
css_prefix: true
# 自定义注入代码
inject:
  head:
    - <link rel="stylesheet" href="/assets/banner.css">
  bottom:
    - <script src="/assets/banner.js"></script>
    - <script src="/js/live2d.js"></script>

# CDN配置
# 非开发环境 internal_provider 可选 local/jsdelivr/unpkg/cdnjs/custom
# third_party_provider 第三方库CDN
